<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Movie Box - Telegram Mini App</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Social Bar Ad -->
  <script data-cfasync="false" src="https://bancadeltempoidea.org/14/6ec3380071a63409857caac0c1180d7e"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent-yellow: #facc15;
      --accent-green: #22c55e;
      --accent-orange: #f97316;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 70px;
      min-height: 100vh;
    }

    /* হেডার ও ৩-ডট মেনু */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 5px 0 12px 0;
      position: relative;
    }

    .header-bar h1 {
      font-size: 20px;
      color: var(--primary);
      font-weight: 800;
      text-align: center;
      width: 100%;
    }

    .menu-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--primary);
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
    }

    /* ৩-ডট ড্রপডাউন */
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 45px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      z-index: 1000;
      width: 160px;
      overflow: hidden;
    }

    .dropdown-menu div {
      padding: 12px 14px;
      font-size: 13px;
      color: #f1f5f9;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .dropdown-menu div:active {
      background: var(--primary-hover);
    }

    /* ক্যাটাগরি চিপস */
    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .category-pills::-webkit-scrollbar { display: none; }

    .pill {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #0b0f19;
      font-weight: 700;
    }

    /* স্পন্সর ব্যানার */
    .entry-ad-banner {
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      margin-bottom: 12px;
      border: 1px dashed var(--primary);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .entry-ad-banner p { font-size: 13px; color: #f8fafc; font-weight: bold; }
    .entry-ad-banner span {
      font-size: 11px;
      background: var(--accent-yellow);
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 800;
      margin-right: 5px;
    }

    /* সার্চ বক্স */
    .search-box {
      margin-bottom: 15px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    /* মুভি গ্রিড */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .movie-card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .movie-card:active {
      transform: scale(0.98);
      border-color: var(--primary);
    }

    /* পিন করা কার্ডের বিশেষ স্টাইল */
    .movie-card.is-pinned {
      border: 1px solid #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
    }

    .pin-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #f59e0b;
      color: #000000;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 4px;
      z-index: 5;
      box-shadow: 0 2px 5px rgba(0,0,0,0.8);
      letter-spacing: 0.5px;
    }

    .movie-poster-wrap {
      width: 100%;
      height: 230px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
    }

    .movie-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .quality-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: #dc2626;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.8);
      z-index: 2;
      letter-spacing: 0.5px;
    }

    .movie-info {
      padding: 9px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .movie-title {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .movie-rating {
      color: var(--accent-yellow);
      font-weight: 700;
    }

    .movie-date {
      color: var(--text-muted);
      font-size: 11px;
    }

    .extra-tag-line {
      font-size: 10.5px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .extra-tag-line span {
      color: #38bdf8;
      font-weight: 600;
    }

    .dl-trigger-btn {
      background: var(--primary-hover);
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      margin-top: 6px;
    }

    .loader-box {
      grid-column: span 2;
      text-align: center;
      padding: 40px 10px;
      color: var(--primary);
      font-size: 14px;
    }

    /* মডাল ডিজাইন */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      border: 1px solid #475569;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      font-size: 16px;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .modal-sub-details {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .ad-status-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin: 10px 0 14px 0;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    .btn-ad1 { background: var(--accent-yellow); color: #000; }
    .btn-ad2 { background: var(--accent-orange); color: #fff; }

    .action-btn:disabled {
      background: #475569 !important;
      color: #cbd5e1 !important;
      cursor: not-allowed;
    }

    /* ৪টি কোয়ালিটি বাটন */
    .quality-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .quality-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #ffffff;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .quality-btn.has-link {
      border-color: #0284c7;
      background: #132238;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.2);
    }

    .quality-btn.disabled-btn {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: rgba(239, 68, 68, 0.3);
      background: #111827;
    }

    /* নীল ও লাল বাতি */
    .indicator-light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .light-blue {
      background-color: #38bdf8;
      box-shadow: 0 0 10px 3px rgba(56, 189, 248, 0.9);
      animation: pulse-blue 1.5s infinite;
    }

    .light-red {
      background-color: #ef4444;
      box-shadow: 0 0 6px 1px rgba(239, 68, 68, 0.7);
    }

    @keyframes pulse-blue {
      0% { box-shadow: 0 0 4px 1px rgba(56, 189, 248, 0.6); }
      50% { box-shadow: 0 0 12px 4px rgba(56, 189, 248, 1); }
      100% { box-shadow: 0 0 4px 1px rgba(56, 189, 248, 0.6); }
    }

    .close-btn {
      margin-top: 15px;
      background: transparent;
      border: 1px solid #64748b;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>🎬 Movielink bd.com</h1>
    <button class="menu-btn" onclick="toggleMenu(event)">⋮</button>
    
    <div class="dropdown-menu" id="dropdownMenu">
      <div onclick="selectCategory('All', event)">🌐 All (সকল)</div>
      <div onclick="selectCategory('Bangla', event)">🇧🇩 Bangla</div>
      <div onclick="selectCategory('Hindi', event)">🇮🇳 Hindi</div>
      <div onclick="selectCategory('Bollywood', event)">⚡ Bollywood</div>
      <div onclick="selectCategory('Hollywood', event)">🎬 Hollywood</div>
    </div>
  </div>

  <div class="category-pills">
    <div class="pill active" onclick="selectCategory('All', event)">All</div>
    <div class="pill" onclick="selectCategory('Bangla', event)">Bangla</div>
    <div class="pill" onclick="selectCategory('Hindi', event)">Hindi</div>
    <div class="pill" onclick="selectCategory('Bollywood', event)">Bollywood</div>
    <div class="pill" onclick="selectCategory('Hollywood', event)">Hollywood</div>
  </div>

  <div style="margin-bottom: 15px; width: 100%; overflow: hidden; display: flex; justify-content: center; border-radius: 8px;">
    <script async="async" data-cfasync="false" src="https://bancadeltempoidea.org/21/ae890ff8c15af92741885bc6b17aa434"></script>
    <div id="container-ae890ff8c15af92741885bc6b17aa434"></div>
  </div>

  <div class="entry-ad-banner" onclick="openEntryAd()">
    <p><span>SPONSOR</span> স্পন্সরড অফার দেখতে এখানে ক্লিক করুন 🎁</p>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="মুভির নাম খুঁজুন..." onkeyup="filterMovies()">
  </div>

  <div class="movies-grid" id="moviesList">
    <div class="loader-box">গুগল শিট থেকে মুভি লোড হচ্ছে... ⏳</div>
  </div>

  <div class="modal-overlay" id="downloadModal" onclick="checkOverlayClick(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="modalTitle">মুভির নাম</h3>
      <div class="modal-sub-details" id="modalSubDetails"></div>

      <div class="ad-status-box" id="modalStatus">ডাউনলোড করতে ১ম অ্যাডটি দেখুন।</div>

      <button class="action-btn btn-ad1" id="mainActionBtn" onclick="handleAdClick()">
        👉 ধাপ ১: ১ম অ্যাড চালু করুন (১০ সে.)
      </button>

      <div class="quality-options-list" id="qualityContainer" style="display: none;"></div>

      <br>
      <button class="close-btn" onclick="closeModal()">বন্ধ করুন</button>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_ID = "1RtUsHpLyk3NoxLCPSb8u4iqBqwMqtfUmWYMkD8tPWeU";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    const ENTRY_AD_URL = "https://auctionr.org/4/65f43ffc33fe79a1323bfe7402ae52f3";
    const DEFAULT_AD2 = "https://asiafilm.org/4/13ea836dfdd1e0cc3f590b100bff3fb6";

    function formatImageUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return '';
      rawUrl = rawUrl.trim();

      if (rawUrl.includes('drive.google.com')) {
        let fileId = '';
        const match1 = rawUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        const match2 = rawUrl.match(/id=([a-zA-Z0-9_-]+)/);
        if (match1 && match1[1]) fileId = match1[1];
        else if (match2 && match2[1]) fileId = match2[1];
        if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
      }
      return rawUrl;
    }

    function openSafeUrl(url) {
      if (!url || url === '#' || !url.startsWith('http')) return;
      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function openEntryAd() {
      openSafeUrl(ENTRY_AD_URL);
    }

    let movies = [];
    let currentMovie = null;
    let adStep = 1;
    let timerInterval = null;
    let activeCategory = 'All';

    function parseQualityData(cellValue, defaultLabel) {
      if (!cellValue) return { link: '', label: defaultLabel };
      const str = String(cellValue).trim();
      
      if (str.includes('|')) {
        const parts = str.split('|');
        return {
          link: parts[0].trim(),
          label: `Download [${parts[1].trim()}]`
        };
      }
      return {
        link: str,
        label: defaultLabel
      };
    }

    // নিরাপদ ডাটা রিডার
    function getCellVal(c, index) {
      if (!c || !c[index] || c[index].v === null || c[index].v === undefined) return '';
      return String(c[index].v).trim();
    }

    function fetchMoviesFromSheet() {
      // ক্যাশ সমস্যা এড়াতে রেন্ডম প্যারামিটার যুক্ত করা হয়েছে
      const url = "https://docs.google.com/spreadsheets/d/" + GOOGLE_SHEET_ID + "/gviz/tq?tqx=out:json&t=" + new Date().getTime();

      fetch(url)
        .then(res => res.text())
        .then(data => {
          // গুগল রেসপন্স থেকে পরিষ্কার JSON বের করা
          const startIdx = data.indexOf('{');
          const endIdx = data.lastIndexOf('}');
          if (startIdx === -1 || endIdx === -1) {
            throw new Error("Invalid response format");
          }

          const json = JSON.parse(data.substring(startIdx, endIdx + 1));
          const rows = json.table?.rows || [];

          let rawMovies = [];
          for (let i = 0; i < rows.length; i++) {
            const c = rows[i].c;
            if (!c) continue;

            const titleStr = getCellVal(c, 0);
            if (!titleStr || titleStr.toLowerCase() === 'title') continue;

            const categoryVal = getCellVal(c, 1) || 'All';
            const ratingVal = getCellVal(c, 2) || '8.0';
            const rawImg = getCellVal(c, 3);
            const ad1Val = getCellVal(c, 4) || ENTRY_AD_URL;
            const ad2Val = (getCellVal(c, 5).startsWith('http')) ? getCellVal(c, 5) : DEFAULT_AD2;

            const q480 = parseQualityData(getCellVal(c, 6), "Download [480p • 477 MB]");
            const q720 = parseQualityData(getCellVal(c, 7), "Download [720p • 1.0 GB]");
            const q1080 = parseQualityData(getCellVal(c, 8), "Download [1080p • 2.2 GB]");
            const qBest = parseQualityData(getCellVal(c, 9), "Download [Best Quality 🔥 • 4.3 GB]");

            const badgeTag = getCellVal(c, 10) || 'WEB-DL';
            const releaseDate = getCellVal(c, 11);
            const genreVal = getCellVal(c, 12);
            const langVal = getCellVal(c, 13);

            // কলাম O (Index 14) চেক করবে 'yes' আছে কিনা
            const isPinned = (getCellVal(c, 14).toLowerCase() === 'yes');

            rawMovies.push({
              id: i + 1,
              title: titleStr,
              category: categoryVal,
              rating: ratingVal.startsWith('⭐') ? ratingVal : `⭐ ${ratingVal}`,
              image: formatImageUrl(rawImg),
              ad1: ad1Val,
              ad2: ad2Val,
              badge: badgeTag,
              date: releaseDate,
              genre: genreVal,
              language: langVal,
              qualities: [q480, q720, q1080, qBest],
              pinned: isPinned
            });
          }

          // ১. নতুন মুভিকে সবার উপরে আনতে উল্টানো হলো
          rawMovies.reverse();

          // ২. পিন করা মুভিগুলোকে সবার শীর্ষে আনা হলো
          const pinnedList = rawMovies.filter(m => m.pinned);
          const normalList = rawMovies.filter(m => !m.pinned);

          movies = pinnedList.concat(normalList);

          renderMovies(movies);
        })
        .catch(err => {
          console.error("Sheet Fetch Error: ", err);
          document.getElementById('moviesList').innerHTML = 
            '<p style="grid-column: span 2; text-align: center; color: #ef4444; padding: 30px;">মুভি লোড হতে সমস্যা হয়েছে! শিটের পারমিশন চেক করুন।</p>';
        });
    }

    function toggleMenu(event) {
      if (event) event.stopPropagation();
      const menu = document.getElementById('dropdownMenu');
      menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function selectCategory(cat, event) {
      if (event) event.stopPropagation();
      activeCategory = cat;
      document.getElementById('dropdownMenu').style.display = 'none';

      const pills = document.querySelectorAll('.pill');
      pills.forEach(pill => {
        if (pill.innerText.trim().toLowerCase() === cat.toLowerCase()) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });
      filterMovies();
    }

    document.addEventListener('click', () => {
      const menu = document.getElementById('dropdownMenu');
      if (menu) menu.style.display = 'none';
    });

    function renderMovies(list) {
      const container = document.getElementById('moviesList');
      container.innerHTML = '';

      if (!list || list.length === 0) {
        container.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #94a3b8; padding: 40px;">কোনো ভিডিও পাওয়া যায়নি!</p>';
        return;
      }

      list.forEach(m => {
        const card = document.createElement('div');
        card.className = `movie-card ${m.pinned ? 'is-pinned' : ''}`;
        card.onclick = () => openModal(m.id);

        const pinTag = m.pinned ? '<div class="pin-badge">📌 PINNED</div>' : '';

        card.innerHTML = `
          ${pinTag}
          <div class="movie-poster-wrap">
            ${m.badge ? `<span class="quality-badge">${m.badge}</span>` : ''}
            <img src="${m.image}" alt="${m.title}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 140%22><rect width=%22100%22 height=%22140%22 fill=%22%231e293b%22/><text x=%2250%%22 y=%2250%%22 fill=%22%2364748b%22 font-size=%2212%22 text-anchor=%22middle%22 dy=%22.3em%22>No Poster</text></svg>'">
          </div>
          <div class="movie-info">
            <div class="movie-title" title="${m.title}">${m.title}</div>
            
            <div class="movie-meta">
              <span class="movie-rating">${m.rating}</span>
              <span class="movie-date">${m.date}</span>
            </div>

            ${m.genre ? `<div class="extra-tag-line"><span>Genre:</span> ${m.genre}</div>` : ''}
            ${m.language ? `<div class="extra-tag-line"><span>Audio:</span> ${m.language}</div>` : ''}

            <button class="dl-trigger-btn" onclick="event.stopPropagation(); openModal(${m.id})">ডাউনলোড</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterMovies() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = movies.filter(m => {
        const matchesCategory = (activeCategory === 'All') || (m.category.toLowerCase() === activeCategory.toLowerCase());
        const matchesSearch = m.title.toLowerCase().includes(q) || 
                              m.genre.toLowerCase().includes(q) || 
                              m.language.toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });
      renderMovies(filtered);
    }

    function openModal(id) {
      currentMovie = movies.find(m => m.id === id);
      if (!currentMovie) return;

      adStep = 1;
      clearInterval(timerInterval);

      document.getElementById('modalTitle').innerText = currentMovie.title;

      let subDetailsText = [];
      if (currentMovie.rating) subDetailsText.push(currentMovie.rating);
      if (currentMovie.date) subDetailsText.push(currentMovie.date);
      if (currentMovie.genre) subDetailsText.push(`Genre: ${currentMovie.genre}`);
      if (currentMovie.language) subDetailsText.push(`Audio: ${currentMovie.language}`);
      document.getElementById('modalSubDetails').innerHTML = subDetailsText.join(' • ');

      document.getElementById('modalStatus').innerHTML = "ডাউনলোড আনলক করতে <b>১ম বিজ্ঞাপনটি</b> দেখুন।";
      
      const btn = document.getElementById('mainActionBtn');
      btn.style.display = 'block';
      btn.className = "action-btn btn-ad1";
      btn.innerText = "👉 ধাপ ১: ১ম অ্যাড চালু করুন (১০ সে.)";
      btn.disabled = false;
      btn.onclick = handleAdClick;

      document.getElementById('qualityContainer').style.display = 'none';
      document.getElementById('downloadModal').style.display = 'flex';
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }

    function handleAdClick() {
      const btn = document.getElementById('mainActionBtn');
      const status = document.getElementById('modalStatus');
      btn.disabled = true;

      const targetAd = (adStep === 1) ? currentMovie.ad1 : currentMovie.ad2;
      openSafeUrl(targetAd);

      let count = 10;
      status.innerHTML = `<span style="color:#38bdf8;">বিজ্ঞাপন লোড হচ্ছে... অনুগ্রহ করে ১০ সেকেন্ড অপেক্ষা করুন।</span>`;
      btn.innerText = `⏳ অপেক্ষা করুন (${count}s)...`;

      timerInterval = setInterval(() => {
        count--;
        btn.innerText = `⏳ অপেক্ষা করুন (${count}s)...`;

        if (count <= 0) {
          clearInterval(timerInterval);

          if (adStep === 1) {
            adStep = 2;
            status.innerHTML = "✅ ১ম অ্যাড দেখা শেষ! এবার <b>২য় অ্যাডটি</b> দেখুন।";
            btn.className = "action-btn btn-ad2";
            btn.innerText = "👉 ধাপ ২: শেষ অ্যাড চালু করুন (১০ সে.)";
            btn.disabled = false;
          } else {
            status.innerHTML = "<b style='color:#4ade80;'>🎉 বিজ্ঞাপন শেষ! নিচের কোয়ালিটি বেছে নিন:</b>";
            btn.style.display = 'none';
            showQualityOptions();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          }
        }
      }, 1000);
    }

    function showQualityOptions() {
      const container = document.getElementById('qualityContainer');
      container.innerHTML = '';

      currentMovie.qualities.forEach(q => {
        const hasValidLink = q.link && q.link.trim().startsWith('http');
        const qBtn = document.createElement('div');
        qBtn.className = `quality-btn ${hasValidLink ? 'has-link' : 'disabled-btn'}`;

        const lightClass = hasValidLink ? 'light-blue' : 'light-red';

        qBtn.innerHTML = `
          <span>${q.label}</span>
          <span class="indicator-light ${lightClass}" title="${hasValidLink ? 'Available' : 'Unavailable'}"></span>
        `;

        if (hasValidLink) {
          qBtn.onclick = () => {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            openSafeUrl(q.link);
          };
        } else {
          qBtn.onclick = () => {
            alert('দুঃখিত! এই কোয়ালিটির লিংক এখনও যুক্ত করা হয়নি।');
          };
        }

        container.appendChild(qBtn);
      });

      container.style.display = 'flex';
    }

    function checkOverlayClick(e) {
      if (e.target.id === 'downloadModal') closeModal();
    }

    function closeModal() {
      clearInterval(timerInterval);
      document.getElementById('downloadModal').style.display = 'none';
    }

    fetchMoviesFromSheet();
  </script>
</body>
</html>
